{% extends 'base.html' %}
{% block title %}{{ action }} Book{% endblock %}
{% block page_title %}{{ action }} Book{% endblock %}

{% block content %}
<div class="page-header">
  <h1><i class="fas fa-{{ 'plus-circle' if action == 'Add' else 'edit' }}"></i> {{ action }} Book</h1>
  <a href="{{ url_for('books') }}" class="btn btn-ghost">
    <i class="fas fa-arrow-left"></i> Back to Books
  </a>
</div>

<div class="card">
  <div class="card-header">
    <i class="fas fa-book" style="color:var(--primary)"></i>
    <h2>Book Information</h2>
  </div>
  <div class="card-body">
    <form method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label for="isbn">ISBN <span style="color:var(--danger)">*</span></label>
          <input type="text" id="isbn" name="isbn"
                 value="{{ book.isbn if book else '' }}"
                 placeholder="e.g. 978-3-16-148410-0" required>
          <span class="hint">Unique identifier for the book</span>
        </div>
        <div class="form-group">
          <label for="title">Title <span style="color:var(--danger)">*</span></label>
          <input type="text" id="title" name="title"
                 value="{{ book.title if book else '' }}"
                 placeholder="Book title" required>
        </div>
        <div class="form-group">
          <label for="author">Author(s) <span style="color:var(--danger)">*</span></label>
          <input type="text" id="author" name="author"
                 value="{{ book.author if book else '' }}"
                 placeholder="Author name(s)" required>
        </div>
        <div class="form-group">
          <label for="publisher">Publisher</label>
          <input type="text" id="publisher" name="publisher"
                 value="{{ book.publisher if book else '' }}"
                 placeholder="Publisher name">
        </div>
        <div class="form-group">
          <label for="publication_year">Publication Year</label>
          <input type="number" id="publication_year" name="publication_year"
                 value="{{ book.publication_year if book else '' }}"
                 placeholder="e.g. 2023" min="1000" max="2099">
        </div>
        <div class="form-group">
          <label for="category">Category / Subject</label>
          <input type="text" id="category" name="category"
                 value="{{ book.category if book else '' }}"
                 placeholder="e.g. Computer Science">
        </div>
        <div class="form-group">
          <label for="edition">Edition</label>
          <input type="text" id="edition" name="edition"
                 value="{{ book.edition if book else '' }}"
                 placeholder="e.g. 3rd Edition">
        </div>
        <div class="form-group">
          <label for="language">Language</label>
          <select id="language" name="language">
            {% for lang in ['English','Amharic','French','Arabic','German','Other'] %}
            <option value="{{ lang }}"
              {{ 'selected' if book and book.language == lang else '' }}>
              {{ lang }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label for="total_copies">Total Copies <span style="color:var(--danger)">*</span></label>
          <input type="number" id="total_copies" name="total_copies"
                 value="{{ book.total_copies if book else 1 }}"
                 min="1" required>
        </div>
        <div class="form-group">
          <label for="shelf_location">Shelf Location</label>
          <input type="text" id="shelf_location" name="shelf_location"
                 value="{{ book.shelf_location if book else '' }}"
                 placeholder="e.g. A-12, Row 3">
        </div>
        {% if book %}
        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" name="status">
            {% for s in ['Available','Issued','Lost'] %}
            <option value="{{ s }}" {{ 'selected' if book.status == s else '' }}>{{ s }}</option>
            {% endfor %}
          </select>
        </div>
        {% endif %}
      </div>

      <div class="form-actions" style="margin-top:24px;">
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-save"></i> {{ action }} Book
        </button>
        <a href="{{ url_for('books') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
