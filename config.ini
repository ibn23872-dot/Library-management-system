# ============================================
# Library Management System - Configuration
# Change these values without code rewrite
# ============================================

[library]
name = Addis Ababa University Library
address = Addis Ababa University, Ethiopia

[borrowing]
# Number of days a book can be borrowed per membership type
student_borrow_days  = 14
faculty_borrow_days  = 30
staff_borrow_days    = 21

# Maximum books a member can borrow at once
student_borrow_limit = 3
faculty_borrow_limit = 5
staff_borrow_limit   = 4

[fines]
# Fine per overdue day in ETB (Ethiopian Birr)
daily_fine_rate = 2.00

[security]
# Session timeout in minutes
session_timeout = 60

[database]
db_path = library.db
